name: Test

on:
  push:
    branches:
    - main
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      sha:
        description: "The commit to check out at. Defaults to the parent workflow's github.sha."
        required: false
        type: string
      v8_hash:
        description: The V8 commit hash to build at. Defaults to the previously built version.
        required: false
        type: string

jobs:
  test:
    name: Tests on ${{ matrix.os }} ${{ matrix.arch }} with Go ${{ matrix.go-version }}
    strategy:
      matrix:
        include:
        - os: linux
          arch: amd64
          platform: ubuntu-24.04
          go-version: stable
        - os: linux
          arch: arm64
          platform: ubuntu-24.04-arm
          go-version: stable
        - os: darwin
          arch: amd64
          platform: macos-15-intel
          go-version: stable
        - os: darwin
          arch: arm64
          platform: macos-15
          go-version: stable
    runs-on: ${{ matrix.platform }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha }}

    - uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}

    - name: Verify native execution target
      env:
        EXPECTED_GOOS: ${{ matrix.os }}
        EXPECTED_GOARCH: ${{ matrix.arch }}
      run: |
        test "$(go env GOOS)" = "$EXPECTED_GOOS"
        test "$(go env GOARCH)" = "$EXPECTED_GOARCH"
        test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"

    - name: Verify snapshot native identities
      run: python3 scripts/snapshot-identity.py --check

    - run: make test

    - uses: dorny/test-reporter@v3
      if: success() || failure()
      with:
        name: Go Test Results
        path: .test/reports/**-test.xml
        reporter: java-junit
        fail-on-error: "true"
  
    - uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: Test Reports ${{ matrix.os }} ${{ matrix.arch }} Go ${{ matrix.go-version }}
        path: .test/reports/**

  # Windows links cgo with MinGW-w64 (not MSVC), so it needs the MSYS2 toolchain
  # rather than the plain make-test matrix above. This is a lighter smoke test
  # (no -race/gotestsum) that exercises the committed Windows lib end-to-end.
  test_windows:
    name: Tests on windows amd64 (MinGW)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: Setup MSYS2 (MinGW64)
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        path-type: inherit
        install: >-
          mingw-w64-x86_64-gcc
          mingw-w64-x86_64-pkgconf

    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.sha }}

    - uses: actions/setup-go@v6
      with:
        go-version-file: ./go.mod

    - name: go build & test
      env:
        CGO_ENABLED: '1'
      run: |
        go build -v .
        go test -short -count=1 -v .
